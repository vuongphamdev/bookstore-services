version: '3.8'

# Development Docker Compose with hot-reload
# Usage: docker-compose -f docker-compose.dev.yml up

services:
  # ================================
  # MySQL Database Service
  # ================================
  db:
    image: mysql:8.0
    container_name: courifly-db-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-courifly_db}
      MYSQL_USER: ${DB_USER:-courifly_user}
      MYSQL_PASSWORD: ${DB_PASS:-courifly_password}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mysql_data_dev:/var/lib/mysql
    networks:
      - courifly-network-dev
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${DB_ROOT_PASSWORD:-rootpassword}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ================================
  # Courifly API Service (Development with hot-reload)
  # ================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: courifly-api-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3000}
      SERVER_URL: ${SERVER_URL:-http://localhost:3000}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-courifly_user}
      DB_PASS: ${DB_PASS:-courifly_password}
      DB_NAME: ${DB_NAME:-courifly_db}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key}
      JWT_EXPIRE_TIME: ${JWT_EXPIRE_TIME:-1h}
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      # Mount source code for hot-reload
      - ./src:/app/src:ro
      - ./swagger.yaml:/app/swagger.yaml:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - courifly-network-dev
    command: npm run dev

# ================================
# Networks
# ================================
networks:
  courifly-network-dev:
    driver: bridge

# ================================
# Volumes
# ================================
volumes:
  mysql_data_dev:
    driver: local
