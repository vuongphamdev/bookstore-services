name: Reusable Deploy Workflow

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment (dev, staging, prod)'
        required: true
        type: string
      image-tag:
        description: 'Docker image tag to deploy'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.HOST_KEY }}
          script: |
            sudo mkdir -p /opt/courifly
            sudo chown -R $USER:$USER /opt/courifly

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.HOST_KEY }}
          source: 'docker-compose.yml'
          target: '/opt/courifly/'

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/courifly
          TAG: ${{ inputs.image-tag }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.HOST_KEY }}
          envs: DOCKER_ACCESS_TOKEN,DOCKER_USERNAME,IMAGE_NAME,TAG
          script: |
            cd /opt/courifly

            cat << 'EOF' > .env
            ${{ secrets.ENV_FILE }}
            EOF

            echo "$DOCKER_ACCESS_TOKEN" | docker login -u "$DOCKER_USERNAME" --password-stdin

            IMAGE_NAME=$IMAGE_NAME TAG=$TAG docker compose pull
            IMAGE_NAME=$IMAGE_NAME TAG=$TAG docker compose up -d

            docker image prune -f

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.HOST_KEY }}
          script: |
            sleep 10
            cd /opt/courifly
            docker compose ps
            curl -f http://localhost:3000/ping || exit 1
            echo "✅ ${{ inputs.environment }} deployment successful!"
