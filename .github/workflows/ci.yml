name: CI/CD Pipeline

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Type checking
        run: npm run type-check

      # - name: Run tests
      #   run: npm run test:ci
      #   env:
      #     NODE_ENV: test

      # - name: Upload coverage reports
      #   if: always()
      #   uses: codecov/codecov-action@v4
      #   with:
      #     files: ./coverage/coverage-final.json
      #     flags: unittests
      #     fail_ci_if_error: false

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  migration:
    name: Database Migration
    runs-on: ubuntu-latest
    needs: [build]
    environment: dev
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_MIGRATION_USER: ${{ secrets.DB_MIGRATION_USER }}
      DB_MIGRATION_PASSWORD: ${{ secrets.DB_MIGRATION_PASSWORD }}
      JWT_ACCESS_TOKEN_SECRET: ${{ secrets.JWT_ACCESS_TOKEN_SECRET }}
      JWT_REFRESH_TOKEN_SECRET: ${{ secrets.JWT_REFRESH_TOKEN_SECRET }}
      JWT_FORGOT_PASSWORD_TOKEN_SECRET: ${{ secrets.JWT_FORGOT_PASSWORD_TOKEN_SECRET }}
      JWT_VERIFY_EMAIL_TOKEN_SECRET: ${{ secrets.JWT_VERIFY_EMAIL_TOKEN_SECRET }}
      JWT_ACCESS_TOKEN_EXPIRE_TIME: ${{ secrets.JWT_ACCESS_TOKEN_EXPIRE_TIME }}
      JWT_REFRESH_TOKEN_EXPIRE_TIME: ${{ secrets.JWT_REFRESH_TOKEN_EXPIRE_TIME }}
      JWT_FORGOT_PASSWORD_TOKEN_EXPIRE_TIME: ${{ secrets.JWT_FORGOT_PASSWORD_TOKEN_EXPIRE_TIME }}
      JWT_VERIFY_EMAIL_TOKEN_EXPIRE_TIME: ${{ secrets.JWT_VERIFY_EMAIL_TOKEN_EXPIRE_TIME }}
      PASSWORD_SALT: ${{ secrets.PASSWORD_SALT }}
      PORT: ${{ secrets.PORT }}
      SERVER_URL: ${{ secrets.SERVER_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run db:migrate:latest

      - name: Check migration status
        run: npm run db:migrate:status

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build, migration]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/

      - name: Deploy to server
        run: echo "Add your deployment commands here"
        # Example deployment commands:
        # - scp -r dist/* user@server:/path/to/app
        # - ssh user@server "pm2 restart app"
        # - Or use a deployment action like easingthemes/ssh-deploy@v2
