name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - 'release/v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options: [dev, staging, prod]
      version:
        description: 'Version/Tag to deploy (e.g., v01.0)'
        required: true

env:
  NODE_VERSION: '20'

jobs:
  # ================================
  # Metadata & Versioning Job
  # ================================
  prep:
    name: Prepare Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      is_release: ${{ steps.vars.outputs.is_release }}
      deploy_env: ${{ steps.vars.outputs.deploy_env }}
    steps:
      - id: vars
        run: |
          # 1. Prepare short SHA (7 characters)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          DATE=$(date +'%Y%m%d')

          # 2. Determine Environment & Version
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "deploy_env=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            VERSION=${GITHUB_REF#refs/heads/release/}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "deploy_env=staging" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            # Format: dev-20251121-a1b2c3
            echo "version=${BRANCH_NAME}-${DATE}-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "deploy_env=dev" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

  # ================================
  # Build and Test Job
  # ================================
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: prep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Checks
        run: |
          npm run format:check
          npm run lint
          npm run type-check
          npm run build

  # ================================
  # Docker Build and Push
  # ================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [prep, build]
    if: github.event_name == 'push'
    environment: ${{ needs.prep.outputs.deploy_env }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/courifly
          tags: |
            type=raw,value=${{ needs.prep.outputs.version }}
            type=raw,value=latest,enable=${{ needs.prep.outputs.is_release == 'true' }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          target: production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ================================
  # Create Git Tag (Release only)
  # ================================
  create_tag:
    name: Create Git Tag
    runs-on: ubuntu-latest
    needs: [prep, docker]
    if: needs.prep.outputs.is_release == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create Tag
        run: |
          git tag ${{ needs.prep.outputs.version }}
          git push origin ${{ needs.prep.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ================================
  # Deploy to Dev / Staging
  # ================================
  deploy:
    name: Deploy to ${{ needs.prep.outputs.deploy_env }}
    needs: [prep, docker]
    # Only run if not production (Production has its own job for approval)
    if: needs.prep.outputs.deploy_env != 'prod'
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: ${{ needs.prep.outputs.deploy_env }}
      image-tag: ${{ needs.prep.outputs.version }}
    secrets: inherit

  # ================================
  # Deploy to Production (Requires Approval)
  # ================================
  deploy_prod:
    name: Deploy to Production
    needs: [prep, deploy]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: prod
      image-tag: ${{ needs.prep.outputs.version }}
    secrets: inherit
