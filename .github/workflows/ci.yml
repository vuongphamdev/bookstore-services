name: CI/CD Pipeline

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]

env:
  NODE_VERSION: '20'
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/courifly

jobs:
  # ================================
  # Build and Test Job
  # ================================
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Type checking
        run: npm run type-check

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  # ================================
  # Docker Build and Push Job
  # ================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    environment: ${{ github.ref_name == 'dev' && 'dev' || 'staging' }}

    outputs:
      tag: ${{ steps.timestamp.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Generate timestamp tag
        id: timestamp
        run: |
          PROPER_TAG="${{ github.ref_name }}-$(date +'%Y%m%d-%H%M%S')"
          echo "tag=$PROPER_TAG" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.timestamp.outputs.tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production

      - name: Print image info
        run: |
          echo "Image: ${{ env.IMAGE_NAME }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "Digest: ${{ steps.build-push.outputs.digest }}"

  # ================================
  # Database Migration Job (Requires Approval)
  # ================================
  migration:
    name: Database Migration
    runs-on: ubuntu-latest
    needs: [build]
    environment: db-migration
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_MIGRATION_USER: ${{ secrets.DB_MIGRATION_USER }}
      DB_MIGRATION_PASSWORD: ${{ secrets.DB_MIGRATION_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Preview pending migrations
        run: npm run db:migrate:status

      - name: ⚠️ Run migrations
        run: npm run db:migrate:latest

      - name: Verify migration status
        run: npm run db:migrate:status

  # ================================
  # Deploy to Dev / Staging
  # ================================
  deploy_base:
    name: Deploy to ${{ github.ref_name == 'dev' && 'Dev' || 'Staging' }}
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main')
    environment: ${{ github.ref_name == 'dev' && 'dev' || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.HOST_KEY }}
          script: |
            sudo mkdir -p /opt/courifly
            sudo chown -R $USER:$USER /opt/courifly

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.HOST_KEY }}
          source: 'docker-compose.yml'
          target: '/opt/courifly/'

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          TAG: ${{ needs.docker.outputs.tag }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.HOST_KEY }}
          envs: DOCKER_ACCESS_TOKEN,DOCKER_USERNAME,IMAGE_NAME,TAG
          script: |
            cd /opt/courifly

            cat << 'EOF' > .env
            ${{ secrets.ENV_FILE }}
            EOF

            echo "$DOCKER_ACCESS_TOKEN" | docker login -u "$DOCKER_USERNAME" --password-stdin

            IMAGE_NAME=$IMAGE_NAME TAG=$TAG docker compose pull
            IMAGE_NAME=$IMAGE_NAME TAG=$TAG docker compose up -d

            docker image prune -f

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.HOST_KEY }}
          script: |
            sleep 10
            cd /opt/courifly
            docker compose ps
            curl -f http://localhost:3000/ping || exit 1
            echo "✅ Deployment successful!"

  # ================================
  # Deploy to Production (Requires Approval)
  # ================================
  deploy_prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy_base, docker]
    if: github.event_name == 'push' && github.ref_name == 'main'
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.HOST_KEY }}
          script: |
            sudo mkdir -p /opt/courifly
            sudo chown -R $USER:$USER /opt/courifly

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.HOST_KEY }}
          source: 'docker-compose.yml'
          target: '/opt/courifly/'

      - name: Deploy to PROD Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          TAG: ${{ needs.docker.outputs.tag }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.HOST_KEY }}
          envs: DOCKER_ACCESS_TOKEN,DOCKER_USERNAME,IMAGE_NAME,TAG
          script: |
            cd /opt/courifly

            cat << 'EOF' > .env
            ${{ secrets.ENV_FILE }}
            EOF

            echo "$DOCKER_ACCESS_TOKEN" | docker login -u "$DOCKER_USERNAME" --password-stdin

            IMAGE_NAME=$IMAGE_NAME TAG=$TAG docker compose pull
            IMAGE_NAME=$IMAGE_NAME TAG=$TAG docker compose up -d

            docker image prune -f

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.HOST_KEY }}
          script: |
            sleep 10
            cd /opt/courifly
            docker compose ps
            curl -f http://localhost:3000/ping || exit 1
            echo "✅ Production Deployment successful!"
