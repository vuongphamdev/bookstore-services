name: Database Maintenance

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run database commands'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
          - prod
      command:
        description: 'Database command to run'
        required: true
        default: 'migrate'
        type: choice
        options:
          - migrate (latest)
          - rollback (1 step)
          - status
          - seed

jobs:
  db-task:
    name: DB ${{ github.event.inputs.command }} on ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: db-migration

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute command
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_MIGRATION_USER }}
          DB_PASSWORD: ${{ secrets.DB_MIGRATION_PASSWORD }}
        run: |
          # Map friendly names to npm scripts
          case "${{ github.event.inputs.command }}" in
            "migrate (latest)")
              CMD="db:migrate:latest"
              ;;
            "rollback (1 step)")
              CMD="db:migrate:rollback"
              ;;
            "status")
              CMD="db:migrate:status"
              ;;
            "seed")
              CMD="db:seed:run"
              ;;
            *)
              echo "Invalid command"
              exit 1
              ;;
          esac

          echo "🚀 Running npm run $CMD on ${{ github.event.inputs.environment }} environment (targeting ${{ secrets.HOST }})..."
          npm run $CMD
