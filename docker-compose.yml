services:
  # ================================
  # MySQL Database Service
  # ================================
  db:
    image: mysql:8.0
    container_name: courifly-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - courifly-network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${DB_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ================================
  # Courifly API Service
  # ================================
  api:
    image: ${IMAGE_NAME}:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: courifly-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - '${SERVER_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - courifly-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/ping']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# ================================
# Networks
# ================================
networks:
  courifly-network:
    driver: bridge

# ================================
# Volumes
# ================================
volumes:
  mysql_data:
    driver: local
