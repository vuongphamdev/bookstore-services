openapi: 3.0.3
info:
  title: Courifly API
  version: 1.0.0
  description: Courifly - Courier delivery and order tracking platform API. Built with Node.js/Express/MySQL.
servers:
  - url: '{SERVER_HOST}:{SERVER_PORT}'
    description: API server (set dynamically)
paths:
  /ping:
    get:
      summary: Ping database
      description: Health check endpoint to test database connectivity.
      responses:
        '200':
          description: Ping success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  time:
                    type: string
                    format: date-time
        '500':
          description: Internal server error
  /auth/register:
    post:
      summary: Register a new user
      description: Create a new user account with authentication
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: 'Test user'
                email:
                  type: string
                  format: email
                  example: 'test@email.com'
                password:
                  type: string
                  example: 'test@123'
                dob:
                  type: string
                  format: date
                  example: '1996-01-01'
                phone_number:
                  type: string
                  example: '+1234567890'
                address:
                  type: string
                  example: '123 Main St'
      responses:
        '201':
          description: User registered successfully
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=<token>; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User registered successfully'
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      accessToken:
                        type: string
                        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        '409':
          description: Email already in use
        '500':
          description: Registration failed
  /auth/login:
    post:
      summary: Login user
      description: Authenticate user with email and password
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: 'test@email.com'
                password:
                  type: string
                  example: 'test@123'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=<token>; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Login successful'
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        '401':
          description: Invalid credentials
        '500':
          description: Login failed
  /auth/refresh-token:
    post:
      summary: Refresh access token
      description: Get a new access token using the refresh token stored in HTTP-only cookie
      tags:
        - Authentication
      parameters:
        - name: Cookie
          in: header
          description: Refresh token cookie
          required: true
          schema:
            type: string
            example: 'refreshToken=<token>'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Token refreshed successfully'
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        '401':
          description: Invalid or missing refresh token
        '500':
          description: Token refresh failed
  /auth/logout:
    post:
      summary: Logout user
      description: Clear refresh token cookie and logout user
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=; HttpOnly; Secure; SameSite=Strict; Max-Age=0
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Logged out successfully'
                  data:
                    type: object
                    nullable: true
        '401':
          description: Unauthorized
        '500':
          description: Logout failed
  /users/me:
    get:
      summary: Get current user
      description: Get the profile of the currently authenticated user
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'User data retrieved successfully'
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '404':
          description: User not found
  /users:
    get:
      summary: Get all users
      description: Retrieve all users
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUsers'
        '400':
          description: Invalid input
  /users/{id}:
    get:
      summary: Get user by ID
      description: Retrieve a specific user with their roles
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserWithRoles'
        '404':
          description: User not found
        '400':
          description: Invalid input
    put:
      summary: Update user
      description: Update user information
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '404':
          description: User not found
        '400':
          description: Invalid input
    delete:
      summary: Delete user
      description: Delete a user account
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '404':
          description: User not found
        '400':
          description: Invalid input

  /shops:
    get:
      summary: Get all shops
      description: Retrieve all shops
      tags:
        - Shops
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of shops
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseShops'
        '500':
          description: Failed to fetch shops
    post:
      summary: Create a new shop
      description: Create a new shop
      tags:
        - Shops
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopCreate'
      responses:
        '201':
          description: Shop created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseShop'
        '400':
          description: Missing required fields
  /shops/{id}:
    get:
      summary: Get shop by ID
      description: Retrieve a specific shop
      tags:
        - Shops
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Shop found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseShop'
        '404':
          description: Shop not found
    put:
      summary: Update shop
      description: Update shop information
      tags:
        - Shops
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopUpdate'
      responses:
        '200':
          description: Shop updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseShop'
        '404':
          description: Shop not found
        '403':
          description: Forbidden
    delete:
      summary: Delete shop
      description: Delete a shop
      tags:
        - Shops
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Shop deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '404':
          description: Shop not found
        '403':
          description: Forbidden
  /shops/my:
    get:
      summary: Get my shops
      description: Retrieve all shops owned by the current user
      tags:
        - Shops
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of my shops
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseShops'
  /reports/top-selling-products:
    get:
      summary: Get top selling products
      description: Retrieve top selling products
      tags:
        - Reports
      security:
        - BearerAuth: []
      parameters:
        - name: top
          in: query
          required: false
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: Top selling products retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Top 10 best-selling products retrieved successfully'
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        product_id:
                          type: integer
                        product_name:
                          type: string
                        total_sold:
                          type: integer

  /products:
    get:
      summary: Search products
      description: Search products with optional filtering
      tags:
        - Products
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
          description: Search by keyword
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Filter by category
        - name: shop_id
          in: query
          required: false
          schema:
            type: integer
          description: Filter by shop ID
        - name: offset
          in: query
          required: false
          schema:
            type: integer
          description: Offset for pagination
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Limit for pagination
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseProducts'
        '400':
          description: Invalid input
    post:
      summary: Create a new product
      description: Add a new product to the catalog
      tags:
        - Products
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseProduct'
        '400':
          description: Missing required fields
  /products/{id}:
    get:
      summary: Get product by ID
      description: Retrieve a specific product
      tags:
        - Products
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseProduct'
        '404':
          description: Product not found
        '400':
          description: Invalid input
    put:
      summary: Update product
      description: Update product information
      tags:
        - Products
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '404':
          description: Product not found
        '400':
          description: Invalid input
    delete:
      summary: Delete product
      description: Remove a product from the catalog
      tags:
        - Products
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        '200':
          description: Product deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '404':
          description: Product not found
        '400':
          description: Invalid input
  /products/{id}/stock:
    patch:
      summary: Update product stock
      description: Add or subtract from product inventory
      tags:
        - Products
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockUpdate'
      responses:
        '200':
          description: Stock updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '404':
          description: Product not found
        '400':
          description: Invalid operation
  /orders:
    get:
      summary: Get all orders
      description: Retrieve all orders with optional filtering
      tags:
        - Orders
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: integer
          description: Filter by user ID
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Filter by order status
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOrders'
        '400':
          description: Invalid input
    post:
      summary: Create a new order
      description: Create a new order with items
      tags:
        - Orders
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOrder'
        '400':
          description: Missing required fields or insufficient stock
  /orders/{id}:
    get:
      summary: Get order by ID
      description: Retrieve a specific order with all items
      tags:
        - Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOrderWithItems'
        '404':
          description: Order not found
        '400':
          description: Invalid input
    put:
      summary: Update order
      description: Update order status
      tags:
        - Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
      responses:
        '200':
          description: Order updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '404':
          description: Order not found
        '400':
          description: Invalid input
    delete:
      summary: Delete order
      description: Cancel and delete an order (restores stock)
      tags:
        - Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        '200':
          description: Order deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '404':
          description: Order not found
        '400':
          description: Invalid input
  /orders/{orderId}/items:
    get:
      summary: Get order items
      description: Retrieve all items for a specific order
      tags:
        - Orders
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order items retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOrderItems'
        '404':
          description: Order not found
    post:
      summary: Add item to order
      description: Add a new item to an existing order
      tags:
        - Orders
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderItemCreate'
      responses:
        '201':
          description: Item added to order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '400':
          description: Missing required fields or insufficient stock
        '404':
          description: Order or product not found
  /orders/{orderId}/items/{itemId}:
    delete:
      summary: Remove item from order
      description: Remove a specific item from an order
      tags:
        - Orders
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Item removed from order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '404':
          description: Order or item not found
  /roles:
    get:
      summary: Get all roles
      description: Retrieve all available roles
      tags:
        - Roles
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRoles'
    post:
      summary: Create a new role
      description: Create a new user role
      tags:
        - Roles
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
      responses:
        '201':
          description: Role created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRole'
        '400':
          description: Missing required fields
        '409':
          description: Role with name already exists
  /roles/{id}:
    get:
      summary: Get role by ID
      description: Retrieve a specific role
      tags:
        - Roles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Role found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRole'
        '404':
          description: Role not found
    put:
      summary: Update role
      description: Update role information
      tags:
        - Roles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
      responses:
        '200':
          description: Role updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuccess'
        '404':
          description: Role not found
        '400':
          description: Invalid input

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token for authentication
  schemas:
    Shop:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: ['A', 'I', 'S', 'C', 'X']
          description: 'Shop status - A: Active, I: Inactive, S: Suspended, C: Closed, X: Deleted'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ShopCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: 'My Awesome Bookshop'
        description:
          type: string
          example: 'Best books in town'
    ShopUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: ['A', 'I', 'S', 'C', 'X']
          description: 'Shop status - A: Active, I: Inactive, S: Suspended, C: Closed, X: Deleted'
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: ['A', 'U', 'G']
          description: 'User role - A: Admin, U: User, G: Guest'
        status:
          type: string
          enum: ['A', 'I', 'S', 'U', 'X']
          description: 'User status - A: Active, I: Inactive, S: Suspended, U: Unverified, X: Deleted'
        dob:
          type: string
          format: date
          nullable: true
        phone_number:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserUpdate:
      type: object
      properties:
        name:
          type: string
        dob:
          type: string
          format: date
        phone_number:
          type: string
        address:
          type: string
    UserWithRoles:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            roles:
              type: array
              items:
                type: string
              example: ['admin', 'customer']
    UserRoleAssignment:
      type: object
      required:
        - userId
        - roleId
      properties:
        userId:
          type: integer
          example: 1
        roleId:
          type: integer
          example: 2
    Product:
      type: object
      properties:
        id:
          type: integer
        shop_id:
          type: integer
        name:
          type: string
        sku:
          type: string
        category:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
        stock:
          type: integer
        status:
          type: string
          enum: ['A', 'O', 'P', 'D', 'X']
          description: 'Product status - A: Available, O: Out of Stock, P: Preorder, D: Discontinued, X: Deleted'
        metadata:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductCreate:
      type: object
      required:
        - name
        - sku
        - category
        - price
        - stock
        - status
        - shop_id
      properties:
        shop_id:
          type: integer
          example: 1
        name:
          type: string
          example: 'The Great Gatsby'
        sku:
          type: string
          example: 'BOOK-001'
        category:
          type: string
